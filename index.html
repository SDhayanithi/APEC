<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Student Login | Adhiparasakthi Engineering College</title>
  <meta name="description" content="Adhiparasakthi Engineering College Student Portal">
  <meta name="theme-color" content="#655CF6">
  
  <link rel="icon" type="image/png" href="assets/college-logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Ambient Light Background Blobs -->
  <div class="bg-blob bg-blob-1" aria-hidden="true"></div>
  <div class="bg-blob bg-blob-2" aria-hidden="true"></div>

  <!-- Student Login Portal Container -->
  <main class="login-wrapper">
    <div class="login-card">
      
      <!-- College Header Section -->
      <header class="college-header">
        <div class="logo-container">
          <img 
            src="assets/college-logo.png" 
            alt="Adhiparasakthi Engineering College Emblem" 
            class="college-logo"
            loading="eager"
          >
        </div>
        <h1 class="college-name">
          ADHIPARASAKTHI<br>ENGINEERING COLLEGE
        </h1>
        <p class="college-motto">STUDY • SPIRITUALITY • SERVICE</p>
        <span class="portal-subtitle">Student Portal</span>
      </header>

      <div class="header-divider" aria-hidden="true"></div>

      <!-- Login Title Section -->
      <div class="login-title-section">
        <h2 class="login-title">Student Login</h2>
        <p class="login-subtitle">Enter your credentials to access your account</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="login-form">
        
        <!-- Register Number Input -->
        <div class="input-group">
          <label for="registerNumber" class="input-label">Register Number</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="registerNumber" 
              name="registerNumber" 
              class="form-input" 
              placeholder="Enter your register number" 
              autocomplete="username" 
              required
            >
          </div>
        </div>

        <!-- Password Input -->
        <div class="input-group">
          <label for="password" class="input-label">Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input password-input" 
              placeholder="Enter your password" 
              autocomplete="current-password" 
              required
            >
            <button 
              type="button" 
              id="togglePassword" 
              class="eye-button" 
              aria-label="Show password"
              title="Toggle password visibility"
            >
              <svg class="eye-icon" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Options: Remember Me & Forgot Password -->
        <div class="options-bar">
          <label for="rememberMe" class="remember-label">
            <input 
              type="checkbox" 
              id="rememberMe" 
              name="rememberMe" 
              class="remember-checkbox"
            >
            <span>Remember me</span>
          </label>
          <a href="#" id="forgotPassword" class="forgot-link">Forgot Password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="loginButton" class="login-button">
          LOGIN
        </button>

      </form>

      <!-- Footer Section -->
      <footer class="portal-footer">
        <p><strong>Adhiparasakthi Engineering College</strong></p>
        <p>Melmaruvathur – 603319</p>
      </footer>

    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
