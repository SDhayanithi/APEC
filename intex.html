!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | Adhiparasakthi Engineering College</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top left,#e8eaff,transparent 35%),radial-gradient(circle at bottom right,#d9d5ff,transparent 35%),#f5f6fb;padding:20px}
.login-wrapper{width:100%;max-width:430px}.login-card{background:rgba(255,255,255,.94);border-radius:24px;padding:38px 35px;box-shadow:0 25px 60px rgba(50,45,100,.15)}
.logo-container{display:flex;justify-content:center;margin-bottom:18px}.college-logo{width:105px;height:105px;object-fit:contain}
.college-name{text-align:center;color:#29245c;font-size:20px;font-weight:800;line-height:1.35}.portal-text{text-align:center;color:#77758b;font-size:14px;margin:7px 0 30px}
.login-title{font-size:25px;color:#19172d;margin-bottom:7px}.login-subtitle{color:#858397;font-size:13px;margin-bottom:24px}
.input-group{margin-bottom:18px}.input-label{display:block;font-size:13px;font-weight:600;color:#444158;margin-bottom:8px}.input-wrapper{position:relative}
.input{width:100%;height:50px;border:1px solid #deddea;border-radius:12px;padding:0 15px;font-size:14px;outline:none;background:#fafaff}.input:focus{border-color:#6c63ff;box-shadow:0 0 0 4px rgba(108,99,255,.10);background:#fff}
.password-input{padding-right:48px}.eye-button{position:absolute;right:14px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:18px}
.options{display:flex;justify-content:space-between;align-items:center;margin:4px 0 24px;font-size:12px}.remember{display:flex;gap:7px;color:#68657a}.remember input{accent-color:#6c63ff}.forgot{color:#655cf5;text-decoration:none;font-weight:600}
.login-button{width:100%;height:51px;border:0;border-radius:12px;background:linear-gradient(135deg,#655cf6,#8278ff);color:white;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 10px 25px rgba(101,92,246,.25)}
.footer{text-align:center;margin-top:25px;color:#9996aa;font-size:11px;line-height:1.6}.footer strong{color:#6a667d}
@media(max-width:480px){body{padding:15px}.login-card{padding:30px 23px}.college-logo{width:88px;height:88px}.college-name{font-size:17px}}
</style>
</head>
